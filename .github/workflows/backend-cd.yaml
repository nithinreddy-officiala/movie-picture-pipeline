name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Check backend style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install compiler requirements
        run: sudo apt-get update && sudo apt-get install -y python3-dev build-essential
      - run: python -m pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run lint

  test:
    name: Check backend behavior
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install compiler requirements
        run: sudo apt-get update && sudo apt-get install -y python3-dev build-essential
      - run: python -m pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run test

  publish:
    name: Build and publish backend
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary AWS session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Authenticate Docker with ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Create commit-tagged image
        run: docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" .
      - name: Upload image
        run: docker push "$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Release backend to EKS
    runs-on: ubuntu-latest
    needs: publish
    defaults:
      run:
        working-directory: starter/backend/k8s
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary AWS session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - name: Connect kubectl to cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Point manifest at this release
        run: kustomize edit set image backend="$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Apply manifests
        run: kustomize build . | kubectl apply -f -
      - name: Confirm rollout
        run: kubectl rollout status deployment/backend --timeout=5m
